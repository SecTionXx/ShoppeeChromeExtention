<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shopee Product Extractor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 400px;
        padding: 10px;
      }
      .product {
        border-bottom: 1px solid #ddd;
        padding: 10px 0;
        display: flex;
        align-items: center;
      }
      .product img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        margin-right: 10px;
      }
      .product a {
        text-decoration: none;
        color: #007bff;
        font-size: 14px;
      }
      .product-details {
        flex: 1;
      }
      button {
        margin: 5px;
        padding: 5px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Shopee Product Extractor</h2>
    <button id="fetchData">Extract Data</button>
    <button id="stopExtraction" disabled>Stop</button>
    <button id="saveCsv" disabled>Save to CSV</button>
    <div id="data"></div>
    <script src="popup.js"></script>
  </body>
</html>
